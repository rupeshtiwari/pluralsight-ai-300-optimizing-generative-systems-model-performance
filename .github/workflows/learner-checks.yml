name: Learner scaffold syntax checks

on:
  pull_request:
  push: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts parse
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -r -n1 bash -n
      - name: Course contract is valid JSON
        run: python3 -m json.tool course-contract.json > /dev/null
